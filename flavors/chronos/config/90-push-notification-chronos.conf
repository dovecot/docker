# Dovecot Push Notification Plugin - Chronos Flavor Configuration
#
# This configuration activates the notify and push_notification modules
# along with the chronos driver.

mail_plugins {
  notify = yes
  push_notification = yes
  push_notification_chronos = yes
}

plugin {
  # URL endpoint receiving push notifications for calendar invites (iTIP)
  push_notification_driver = chronos:url=http://localhost:8080/chronos/v1/itip/pushmail

  # Maximum size of message body to include in notification payload (default: 500k)
  # msg_max_size = 500k

  # Request timeout in seconds
  # timeout = 30

  # Maximum retry attempts
  # max_retries = 3
}
